server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - SecureHeaders
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@clientKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_RPS:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**,/api/auth/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: cart-service
          uri: ${CART_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/inventory/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**

shopflow:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    issuer: shopflow
  gateway:
    public-paths:
      - "POST /api/auth/register"
      - "POST /api/auth/login"
      - "POST /api/auth/refresh"
      - "POST /api/auth/logout"
      - "GET /api/products/**"
      - "GET /api/categories/**"
      - "GET /actuator/**"
      - "GET /v3/api-docs/**"
      - "GET /swagger-ui/**"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.shopflow: INFO
