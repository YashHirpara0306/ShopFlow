server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/shopflow_payment
    username: ${POSTGRES_USER:shopflow}
    password: ${POSTGRES_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # activated only when SPRING_KAFKA_BOOTSTRAP_SERVERS is set (compose / tests)
    consumer:
      auto-offset-reset: earliest

shopflow:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    issuer: shopflow
  payment:
    # 0.0 = always succeed, 1.0 = always fail. An amount ending in .13 always fails regardless.
    fail-rate: ${PAYMENT_FAIL_RATE:0.15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopflow: INFO
