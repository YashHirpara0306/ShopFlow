global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: shopflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: {service: api-gateway}
      - targets: ["user-service:8081"]
        labels: {service: user-service}
      - targets: ["product-service:8082"]
        labels: {service: product-service}
      - targets: ["cart-service:8083"]
        labels: {service: cart-service}
      - targets: ["order-service:8084"]
        labels: {service: order-service}
      - targets: ["inventory-service:8085"]
        labels: {service: inventory-service}
      - targets: ["payment-service:8086"]
        labels: {service: payment-service}
      - targets: ["notification-service:8087"]
        labels: {service: notification-service}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
