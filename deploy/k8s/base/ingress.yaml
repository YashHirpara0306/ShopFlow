# Routes all external traffic to the gateway, which does the internal routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopflow
  namespace: shopflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: shopflow.local     # add to /etc/hosts -> 127.0.0.1 for kind
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: {number: 8080}
