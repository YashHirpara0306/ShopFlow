          livenessProbe:  {httpGet: {path: /actuator/health/liveness,  port: 8081}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: shopflow}
spec: {selector: {app: user-service}, ports: [{port: 8081, targetPort: 8081}]}
---
