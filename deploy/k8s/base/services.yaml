# The 8 application services. Image names are logical; kustomization.yaml maps them to a registry.
# envFrom pulls the shared ConfigMap + Secret; SERVER_PORT is per service.
# Probes use Spring Boot's dedicated liveness/readiness groups (management.endpoint.health.probes.enabled=true).
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: shopflow, labels: {app: api-gateway}}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: app
          image: shopflow/api-gateway:latest
          ports: [{containerPort: 8080}]
          env: [{name: SERVER_PORT, value: "8080"}]
          envFrom: [{configMapRef: {name: shopflow-config}}, {secretRef: {name: shopflow-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe:  {httpGet: {path: /actuator/health/liveness,  port: 8080}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: shopflow}
spec:
  selector: {app: api-gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
